# Coturn TURN/STUN relay for the video call app

listening-ip=0.0.0.0
listening-port=3478
tls-listening-port=5349

# Use the port Render provides
relay-ip=0.0.0.0
relay-threads=2

# Long-term credentials
user=videocall:CHANGE_THIS_PASSWORD

realm=videocall.onrender.com

# Allow relay to external peers
no-cli
no-tlsv1
no-tlsv1_1

# Use the Render-assigned external IP for reflection
# (coturn auto-detects; STUN binding works without explicit external-ip)
