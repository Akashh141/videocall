<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Call</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="lobby" class="screen">
    <h1>Video Call</h1>
    <p>Start a call and share the link, or join with a room link.</p>
    <button id="createBtn">Create Call</button>
    <div id="shareBox" class="hidden">
      <p>Share this link with the other person:</p>
      <input id="shareLink" readonly />
      <button id="copyBtn">Copy</button>
    </div>
  </div>

  <div id="call" class="screen hidden">
    <div class="status">
      <div>Your IP: <span id="myIp">…</span></div>
      <div>Room: <span id="roomId">…</span></div>
      <div>Connection: <span id="connState">connecting…</span></div>
      <div class="share-row">Share link: <input id="callShareLink" readonly /><button id="callCopyBtn">Copy</button></div>
    </div>

    <div class="leak-panel">
      <h2>Leaked IPs</h2>
      <div class="leak-row">
        <span class="leak-label">Your public IP (ipify):</span>
        <span id="ipIpify" class="leak-value">…</span>
        <button class="copyIp" data-target="ipIpify">Copy</button>
      </div>
      <div class="leak-row highlight">
        <span class="leak-label">Your real IP via STUN:</span>
        <span id="ipStun" class="leak-value">…</span>
        <button class="copyIp" data-target="ipStun">Copy</button>
      </div>
      <div id="peers"></div>
    </div>

    <div id="log" class="log"></div>

    <div class="videos">
      <video id="localVideo" autoplay playsinline muted></video>
      <video id="remoteVideo" autoplay playsinline muted></video>
    </div>
    <button id="hangupBtn">Hang Up</button>
  </div>

  <script src="config.js?v=2"></script>
  <script src="client.js?v=2"></script>
</body>
</html>
